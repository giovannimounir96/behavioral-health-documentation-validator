[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "behavioral-health-documentation-validator"
version = "0.2.0"
description = "Portfolio-safe validation and exception reporting for synthetic behavioral-health documentation workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141,<1",
    "pandas>=2.2,<4",
    "uvicorn>=0.51,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.9,<3",
    "pytest>=8,<10",
]

[project.scripts]
bh-validate = "bh_doc_validator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
